name: build-patched-php-and-prove-suitecrm

# Builds PHP from the php-src EOL mitigation branches for CVE-2026-109618 /
# CVE-2026-109619 at pinned commits, proves SuiteCRM 7.13 installs and logs
# in on each, and publishes: the built tree, the FULL php-src source at that
# commit, the source of this build apparatus, and SHA256SUMS.  Every run
# publishes artifacts; a v* tag also publishes a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: php ${{ matrix.ver }} (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ver: "7.4"
            branch: PHP-7.4-CVE-2026-109618-109619
            sha: 712e60f9edfd03f0960fc4fc3c2c375f42b90aa2
            image: ubuntu:20.04      # OpenSSL 1.1, libxml2 2.9: what 7.4 was built against in its day
            suitecrm: v7.13.4        # 7.13.x supports PHP 7.4/8.0 (SuiteCRM compatibility matrix)
          - ver: "8.0"
            branch: PHP-8.0-CVE-2026-109618-109619
            sha: 82f8f31b16a035c1b67cc253e79f7cc288f4cc20
            image: ubuntu:20.04      # bullseye-security pool 404s since bullseye LTS ended; 8.0 is fine on the 7.4 base
            suitecrm: v7.13.4
          - ver: "8.1"
            branch: PHP-8.1-CVE-2026-109618-109619
            sha: 1d7dec178a094e6e75b229ce22754045f8c6070a
            image: debian:bookworm
            suitecrm: v7.14.9        # 7.14.x supports PHP 8.1/8.2
    env:
      PREFIX: /opt/php-${{ matrix.branch }}
      SRC: /usr/local/src/php-src-${{ matrix.branch }}
    steps:
      - name: dependencies
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: build deps
        run: sh php/deps.sh
      - name: build php (pinned ${{ matrix.sha }})
        run: JOBS=$(nproc) sh php/build-php.sh ${{ matrix.branch }} ${{ matrix.sha }} "$PREFIX" "$SRC"
      - name: patch signature
        run: sh test/php-signature.sh "$PREFIX" | tee signature-${{ matrix.ver }}.txt
      - name: suitecrm install + login
        run: sh suitecrm/setup-suitecrm.sh "$PREFIX" ${{ matrix.suitecrm }} /var/www/suitecrm 8080 && cp /var/www/SMOKE-RESULT.txt smoke-${{ matrix.ver }}.txt
      - name: package binaries, full sources, checksums
        run: |
          set -eu
          short=$(printf '%s' "${{ matrix.sha }}" | cut -c1-12)
          out=dist; mkdir -p "$out"
          tar -C /opt -czf "$out/php-${{ matrix.ver }}-cve-2026-109618-109619-$short-linux-x86_64.tar.gz" "php-${{ matrix.branch }}"
          git -C "$SRC" archive --format=tar.gz --prefix="php-src-${{ matrix.branch }}-$short/" -o "$GITHUB_WORKSPACE/$out/php-src-${{ matrix.branch }}-$short.tar.gz" "${{ matrix.sha }}"
          git archive --format=tar.gz --prefix=build-apparatus/ -o "$out/build-apparatus-$(git rev-parse --short=12 HEAD).tar.gz" HEAD
          cp "$PREFIX/BUILD-INFO.txt" "$out/BUILD-INFO-${{ matrix.ver }}.txt"
          cp "$SRC/configure.log" "$out/configure-${{ matrix.ver }}.log"
          cp signature-${{ matrix.ver }}.txt smoke-${{ matrix.ver }}.txt "$out/"
          (cd "$out" && sha256sum * > SHA256SUMS-${{ matrix.ver }}.txt && cat SHA256SUMS-${{ matrix.ver }}.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.ver }}-cve-2026-109618-109619
          path: dist/
          if-no-files-found: error

  debian-src:
    # Debian source package: Debian's own php7.4 7.4.33-1+deb11u5 (bullseye)
    # plus one quilt patch carrying php-src 712e60f9ed, versioned
    # 7.4.33-1+deb11u5+isc2.1; then a full binary build from that .dsc as the
    # proof. See debian/build-srcpkg.sh.
    name: debian source package (php7.4, bullseye)
    runs-on: ubuntu-latest
    container: debian:bullseye
    steps:
      - name: apt sources (bullseye is past LTS; use the archive, with deb-src)
        run: |
          set -eu
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb-src http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian-security bullseye-security main
          deb-src http://archive.debian.org/debian-security bullseye-security main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates curl \
            dpkg-dev quilt devscripts debian-keyring debhelper fakeroot
          apt-get build-dep -y -q php7.4
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: source package + binary build
        run: JOBS=$(nproc) BUILD_BINARY=1 sh debian/build-srcpkg.sh "$GITHUB_WORKSPACE/dist-deb" /tmp/w 2>&1 | tee debian-build.txt
      - name: prove the built package carries the patch
        run: |
          set -eu
          cd dist-deb
          dpkg-deb -x php7.4-cli_*_amd64.deb /tmp/cli
          dpkg-deb -x php7.4-common_*_amd64.deb /tmp/cli
          /tmp/cli/usr/bin/php7.4 -v | tee ../php-v.txt
          # max_multipart_body_parts is NOT a discriminator here: Debian's 0056 patch already has it.
          # zend_mm_safe_error_ex is a ZEND_API symbol introduced by the CVE commit and nowhere else
          # in 7.4; php is linked -rdynamic so it is in the dynamic symbol table.
          apt-get install -y -q --no-install-recommends binutils
          nm -D /tmp/cli/usr/bin/php7.4 | grep -q ' T zend_mm_safe_error_ex$' \
            || { echo "zend_mm_safe_error_ex missing from php7.4 binary"; exit 1; }
          echo "zend_mm_safe_error_ex: present" | tee -a ../php-v.txt
          cp ../debian-build.txt ../php-v.txt .
          sha256sum * > SHA256SUMS-debian.txt && cat SHA256SUMS-debian.txt
      - uses: actions/upload-artifact@v4
        with:
          name: php7.4-debian-7.4.33-1+deb11u5+isc2.1
          path: dist-deb/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, debian-src]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -eu
          find dist -type f | sort
          cat dist/*/SHA256SUMS-*.txt > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
            --title "patched PHP for SuiteCRM (CE 6.5 lineage) — ${GITHUB_REF_NAME}" \
            --notes "Binaries, full php-src sources at the pinned commits, this build apparatus, and SHA256SUMS. See README.md." \
            SHA256SUMS dist/*/*
